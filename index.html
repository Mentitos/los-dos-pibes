<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio suspendido</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .wrap {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      border: 1.5px solid #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }

    .label {
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: .75rem;
    }

    h1 {
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 1.25rem;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: #2a2a2a;
      margin: 0 auto 1.5rem;
    }

    p {
      font-size: .95rem;
      color: #666;
      line-height: 1.75;
    }

    p strong { color: #aaa; font-weight: 500; }


  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="label">Sitio web suspendido</div>

    <h1>Esta página fue<br>dada de baja</h1>

    <div class="divider"></div>

    <p>
      El servicio se encuentra suspendido por <strong>cese de pago</strong>.<br>
      Para reactivar el sitio, el titular debe<br>contactarse con el área de ventas.
    </p>

  </div>
</body>
</html>
